<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173f35">
<title>Qur'an — Daily Duas</title>
<style>
@font-face{font-family:IndoPak;src:url("https://verses.quran.foundation/fonts/quran/hafs/nastaleeq/indopak/indopak-nastaleeq-waqf-lazim-v4.2.1.woff2") format("woff2");font-display:swap}
:root{--bg:#f5f2e9;--card:#fffdf8;--ink:#172f29;--muted:#68736e;--green:#236b52;--dark:#173f35;--gold:#b28a3b;--line:#ded8c9;--soft:#eee7d7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
.nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:12px 10px;background:var(--dark)}
.nav a{color:#fff;text-decoration:none;padding:9px 12px;border-radius:999px;background:#2f765f;font-weight:700;font-size:14px}
.wrap{width:min(900px,94%);margin:auto}.hero{padding:22px 0 12px}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{color:var(--ink);text-decoration:none;font-size:26px}.brand{font-size:12px;letter-spacing:3px;color:var(--muted)}
.hero h1{margin:5px 0 0;font-size:30px}.controls{background:var(--card);padding:16px;border:1px solid var(--line);border-radius:24px;box-shadow:0 5px 20px rgba(0,0,0,.05);margin:10px 0 16px}
.control-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}
.search-wrap{position:relative}.search-wrap input,select,button{width:100%;border:1px solid #cfc8b8;border-radius:14px;background:#fff;color:var(--ink);padding:13px;font-size:16px}
.search-wrap input{padding-right:42px}.search-icon{position:absolute;right:13px;top:11px;font-size:20px;color:var(--muted)}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.buttons button{cursor:pointer;background:var(--green);color:#fff;border:none;font-weight:700}.buttons button.secondary{background:var(--soft);color:var(--ink)}
.reader-card{background:var(--card);border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 5px 22px rgba(0,0,0,.05)}
.reader-head{padding:16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.surah-title{min-width:0}.arabic-name{font-size:28px;font-weight:700;direction:rtl}.english-name{color:var(--muted);margin-top:4px}
.juz-pill{background:var(--soft);padding:12px 16px;border-radius:999px;font-weight:700;white-space:nowrap}
.status{text-align:center;color:var(--muted);padding:28px}.error{color:#9a3d32;background:#fff0ed;border-radius:12px;padding:14px;margin:10px;line-height:1.5}
.ayah-card{background:#fffdf8;padding:22px 18px;border-bottom:1px solid var(--line)}.ayah-card:last-child{border-bottom:0}
.quran-page{direction:rtl;text-align:justify;font-family:IndoPak,"Noto Nastaliq Urdu",serif;font-size:29px;line-height:2.35;color:#142d26}
.ayah{display:block;padding:4px 0}.ayah-number{display:inline-flex;direction:ltr;align-items:center;justify-content:center;width:1.5em;height:1.5em;margin:0 .14em;border:1.5px solid var(--gold);border-radius:50%;color:var(--gold);font-family:Arial,sans-serif;font-size:.43em;vertical-align:middle}
.ayah-tools{direction:ltr;display:flex;justify-content:flex-start;gap:14px;margin-top:12px}.ayah-tool{width:42px;height:42px;border:1px solid #cfc8b8;border-radius:50%;background:var(--card);color:var(--green);font-size:19px;padding:0}
.footer{text-align:center;color:var(--muted);font-size:13px;padding:22px}
@media(max-width:600px){.hero h1{font-size:27px}.control-row{grid-template-columns:1fr}.reader-head{align-items:flex-start}.quran-page{font-size:26px;line-height:2.4}.ayah-card{padding:20px 14px}}
</style>
</head>
<body>
<nav class="nav"><a href="index.html">🏠 Home</a><a href="duas.html">🤲 Duas</a><a href="names.html">🕋 Allah's Names</a><a href="quran.html">📖 Qur'an</a><a href="favorites.html">⭐ Favorites</a></nav>

<main class="wrap">
<section class="hero"><div class="hero-top"><a class="back" href="index.html">←</a><div style="text-align:right"><div class="brand">🌙 DAILY DUAS</div><h1>📖 Al Qur'an</h1></div></div></section>

<section class="controls">
<div class="control-row">
<div class="field"><label for="surahSearch">🔎 Surah</label><div class="search-wrap"><input id="surahSearch" list="surahOptions" placeholder="Search Surah name or number…" autocomplete="off"><span class="search-icon">⌕</span></div><datalist id="surahOptions"></datalist></div>
<div class="field"><label for="fontSize">🔤 Text size</label><select id="fontSize"><option value="25">Small</option><option value="29" selected>Medium</option><option value="33">Large</option><option value="37">Extra large</option></select></div>
</div>
<div class="control-row">
<div class="field"><label for="mode">📖 Reading mode</label><select id="mode"><option value="13" selected>13-line Hifz mode</option><option value="normal">Normal</option></select></div>
<div class="field"><label for="ayahJump">🔢 Start ayah</label><select id="ayahJump"></select></div>
</div>
<div class="buttons"><button class="secondary" id="previousBtn">◀ Previous</button><button id="nextBtn">Next ▶</button></div>
</section>

<section class="reader-card">
<div id="status" class="status">Loading Qur'an…</div>
<div id="reader" hidden>
<div class="reader-head"><div class="surah-title"><div id="arabicName" class="arabic-name"></div><div id="englishName" class="english-name"></div></div><div id="juzPill" class="juz-pill">Juz 1</div></div>
<div id="quranPage" class="quran-page"></div>
</div>
</section>
<div class="footer">Qur'an text: local Uthmani text file<br>Built for Daily Duas 🤲</div>
</main>

<script>
const QURAN_FILE="./quran-uthmani.txt";
const surahs=[
[1,"الفاتحة","Al-Faatiha","The Opening"],[2,"البقرة","Al-Baqarah","The Cow"],[3,"آل عمران","Aal-i-Imraan","The Family of Imraan"],[4,"النساء","An-Nisaa","The Women"],[5,"المائدة","Al-Maaida","The Table"],[6,"الأنعام","Al-An'aam","The Cattle"],[7,"الأعراف","Al-A'raaf","The Heights"],[8,"الأنفال","Al-Anfaal","The Spoils of War"],[9,"التوبة","At-Tawba","Repentance"],[10,"يونس","Yunus","Jonah"],[11,"هود","Hud","Hud"],[12,"يوسف","Yusuf","Joseph"],[13,"الرعد","Ar-Ra'd","The Thunder"],[14,"إبراهيم","Ibraaheem","Abraham"],[15,"الحجر","Al-Hijr","The Rocky Tract"],[16,"النحل","An-Nahl","The Bee"],[17,"الإسراء","Al-Israa","The Night Journey"],[18,"الكهف","Al-Kahf","The Cave"],[19,"مريم","Maryam","Mary"],[20,"طه","Taa-Haa","Ta-Ha"],[21,"الأنبياء","Al-Anbiyaa","The Prophets"],[22,"الحج","Al-Hajj","The Pilgrimage"],[23,"المؤمنون","Al-Mu'minoon","The Believers"],[24,"النور","An-Noor","The Light"],[25,"الفرقان","Al-Furqaan","The Criterion"],[26,"الشعراء","Ash-Shu'araa","The Poets"],[27,"النمل","An-Naml","The Ant"],[28,"القصص","Al-Qasas","The Stories"],[29,"العنكبوت","Al-Ankaboot","The Spider"],[30,"الروم","Ar-Room","The Romans"],[31,"لقمان","Luqmaan","Luqman"],[32,"السجدة","As-Sajda","The Prostration"],[33,"الأحزاب","Al-Ahzaab","The Clans"],[34,"سبأ","Saba","Sheba"],[35,"فاطر","Faatir","The Originator"],[36,"يس","Yaseen","Yaseen"],[37,"الصافات","As-Saaffaat","Those Ranges in Ranks"],[38,"ص","Saad","Saad"],[39,"الزمر","Az-Zumar","The Groups"],[40,"غافر","Ghaafir","The Forgiver"],[41,"فصلت","Fussilat","Explained in Detail"],[42,"الشورى","Ash-Shura","The Consultation"],[43,"الزخرف","Az-Zukhruf","The Gold Adornment"],[44,"الدخان","Ad-Dukhaan","The Smoke"],[45,"الجاثية","Al-Jaathiya","Crouching"],[46,"الأحقاف","Al-Ahqaaf","The Wind-Curved Sandhills"],[47,"محمد","Muhammad","Muhammad"],[48,"الفتح","Al-Fath","The Victory"],[49,"الحجرات","Al-Hujuraat","The Rooms"],[50,"ق","Qaaf","Qaaf"],[51,"الذاريات","Adh-Dhaariyat","The Winnowing Winds"],[52,"الطور","At-Tur","The Mount"],[53,"النجم","An-Najm","The Star"],[54,"القمر","Al-Qamar","The Moon"],[55,"الرحمن","Ar-Rahmaan","The Beneficent"],[56,"الواقعة","Al-Waaqia","The Inevitable"],[57,"الحديد","Al-Hadid","The Iron"],[58,"المجادلة","Al-Mujaadila","The Pleading Woman"],[59,"الحشر","Al-Hashr","The Exile"],[60,"الممتحنة","Al-Mumtahana","She that is to be examined"],[61,"الصف","As-Saff","The Ranks"],[62,"الجمعة","Al-Jumu'a","Friday"],[63,"المنافقون","Al-Munaafiqoon","The Hypocrites"],[64,"التغابن","At-Taghaabun","Mutual Disillusion"],[65,"الطلاق","At-Talaaq","Divorce"],[66,"التحريم","At-Tahrim","The Prohibition"],[67,"الملك","Al-Mulk","The Sovereignty"],[68,"القلم","Al-Qalam","The Pen"],[69,"الحاقة","Al-Haaqqa","The Reality"],[70,"المعارج","Al-Ma'aarij","The Ascending Stairways"],[71,"نوح","Nooh","Noah"],[72,"الجن","Al-Jinn","The Jinn"],[73,"المزمل","Al-Muzzammil","The Enshrouded One"],[74,"المدثر","Al-Muddaththir","The Cloaked One"],[75,"القيامة","Al-Qiyaama","The Resurrection"],[76,"الإنسان","Al-Insaan","Man"],[77,"المرسلات","Al-Mursalaat","Those Sent Forth"],[78,"النبأ","An-Naba","The Tidings"],[79,"النازعات","An-Naazi'aat","Those Who Drag Forth"],[80,"عبس","Abasa","He Frowned"],[81,"التكوير","At-Takwir","The Overthrowing"],[82,"الانفطار","Al-Infitaar","The Cleaving"],[83,"المطففين","Al-Mutaffifin","Defrauding"],[84,"الانشقاق","Al-Inshiqaaq","The Sundering"],[85,"البروج","Al-Burooj","The Mansions of the Stars"],[86,"الطارق","At-Taariq","The Night-Comer"],[87,"الأعلى","Al-A'laa","The Most High"],[88,"الغاشية","Al-Ghaashiya","The Overwhelming"],[89,"الفجر","Al-Fajr","The Dawn"],[90,"البلد","Al-Balad","The City"],[91,"الشمس","Ash-Shams","The Sun"],[92,"الليل","Al-Lail","The Night"],[93,"الضحى","Ad-Dhuhaa","The Morning Hours"],[94,"الشرح","Ash-Sharh","The Relief"],[95,"التين","At-Tin","The Fig"],[96,"العلق","Al-Alaq","The Clot"],[97,"القدر","Al-Qadr","The Power"],[98,"البينة","Al-Bayyina","The Clear Proof"],[99,"الزلزلة","Az-Zalzala","The Earthquake"],[100,"العاديات","Al-Aadiyaat","The Courser"],[101,"القارعة","Al-Qaari'a","The Striking Hour"],[102,"التكاثر","At-Takaathur","The Piling Up"],[103,"العصر","Al-Asr","Time"],[104,"الهمزة","Al-Humaza","The Slanderer"],[105,"الفيل","Al-Fil","The Elephant"],[106,"قريش","Quraish","Quraysh"],[107,"الماعون","Al-Maa'oon","Small Kindnesses"],[108,"الكوثر","Al-Kawthar","Abundance"],[109,"الكافرون","Al-Kaafiroon","The Disbelievers"],[110,"النصر","An-Nasr","Divine Support"],[111,"المسد","Al-Masad","The Palm Fibre"],[112,"الإخلاص","Al-Ikhlaas","Sincerity"],[113,"الفلق","Al-Falaq","The Daybreak"],[114,"الناس","An-Naas","Mankind"]
];
const surahSearch=document.getElementById("surahSearch"),surahOptions=document.getElementById("surahOptions"),fontSize=document.getElementById("fontSize"),mode=document.getElementById("mode"),ayahJump=document.getElementById("ayahJump"),previousBtn=document.getElementById("previousBtn"),nextBtn=document.getElementById("nextBtn"),status=document.getElementById("status"),reader=document.getElementById("reader"),arabicName=document.getElementById("arabicName"),englishName=document.getElementById("englishName"),quranPage=document.getElementById("quranPage");
let allAyahs=[],currentSurah=1,currentStart=0;
function escapeHtml(v){return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function fillSurahs(){surahOptions.innerHTML="";surahs.forEach(s=>{const o=document.createElement("option");o.value=`${s[0]} — ${s[2]} — ${s[1]}`;surahOptions.appendChild(o)});surahSearch.value=`1 — ${surahs[0][2]}`}
function findSurah(value){const v=value.trim().toLowerCase();let m=v.match(/^([0-9]{1,3})\s*(?:—|-)?/);if(m){const n=Number(m[1]);if(n>=1&&n<=114)return n}const found=surahs.find(s=>s[2].toLowerCase()===v||s[3].toLowerCase()===v||s[2].toLowerCase().includes(v)||s[3].toLowerCase().includes(v)||s[1].includes(value.trim()));return found?found[0]:null}
function parseQuran(text){const result=[];for(const raw of text.replace(/^\uFEFF/,"").split(/\r?\n/)){const line=raw.trim();if(!line)continue;const p=line.split("|");if(p.length<3)continue;const surah=Number(p[0].trim()),ayah=Number(p[1].trim()),arabic=p.slice(2).join("|").trim();if(Number.isInteger(surah)&&Number.isInteger(ayah)&&arabic)result.push({surah,ayah,arabic})}return result}
function showError(message){status.hidden=false;reader.hidden=true;status.className="status error";status.textContent=message}
function render(){const meta=surahs.find(s=>s[0]===currentSurah),ayahs=allAyahs.filter(a=>a.surah===currentSurah);if(!meta||!ayahs.length){showError("No verses were found for Surah "+currentSurah+".");return}currentStart=Math.max(0,Math.min(currentStart,ayahs.length-1));const pageSize=mode.value==="13"?13:ayahs.length,visible=ayahs.slice(currentStart,currentStart+pageSize);arabicName.textContent=meta[1];englishName.textContent=`${currentSurah}. ${meta[2]} — ${meta[3]} • Ayah ${visible[0].ayah}–${visible[visible.length-1].ayah}`;quranPage.innerHTML=visible.map(a=>`<div class="ayah-card"><div class="ayah">${escapeHtml(a.arabic)} <span class="ayah-number">${a.ayah}</span></div><div class="ayah-tools"><button class="ayah-tool" title="Play">▶</button><button class="ayah-tool" title="Bookmark">♡</button></div></div>`).join("");quranPage.style.fontSize=fontSize.value+"px";ayahJump.innerHTML="";ayahs.forEach((a,i)=>{const o=document.createElement("option");o.value=i;o.textContent="Ayah "+a.ayah;ayahJump.appendChild(o)});ayahJump.value=String(currentStart);previousBtn.disabled=currentStart===0;nextBtn.disabled=currentStart+visible.length>=ayahs.length;surahSearch.value=`${meta[0]} — ${meta[2]}`;status.hidden=true;reader.hidden=false}
async function loadQuran(){try{const response=await fetch(QURAN_FILE,{cache:"no-store"});if(!response.ok)throw new Error("Could not load quran-uthmani.txt ("+response.status+"). Make sure it is beside quran.html.");allAyahs=parseQuran(await response.text());if(!allAyahs.length)throw new Error("The Qur'an file was found, but its format could not be read. Expected: surah|ayah|Arabic text");fillSurahs();render()}catch(e){showError(e.message)}}
surahSearch.addEventListener("change",()=>{const n=findSurah(surahSearch.value);if(n){currentSurah=n;currentStart=0;render()}else{surahSearch.value=`${currentSurah} — ${surahs[currentSurah-1][2]}`}});
surahSearch.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();surahSearch.dispatchEvent(new Event("change"))}});
fontSize.addEventListener("change",render);mode.addEventListener("change",render);ayahJump.addEventListener("change",()=>{currentStart=Number(ayahJump.value);render()});
previousBtn.addEventListener("click",()=>{currentStart=Math.max(0,currentStart-(mode.value==="13"?13:1));render()});
nextBtn.addEventListener("click",()=>{const count=allAyahs.filter(a=>a.surah===currentSurah).length;currentStart=Math.min(count-1,currentStart+(mode.value==="13"?13:1));render()});
loadQuran();
</script>
</body>
</html>
