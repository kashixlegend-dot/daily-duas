<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173f35">
<title>Qur'an — Daily Duas</title>
<style>
@font-face{
  font-family:IndoPak;
  src:url("https://verses.quran.foundation/fonts/quran/hafs/nastaleeq/indopak/indopak-nastaleeq-waqf-lazim-v4.2.1.woff2") format("woff2");
  font-display:swap;
}
:root{--bg:#f5f2e9;--card:#fffdf8;--ink:#19352e;--muted:#68736e;--green:#2f6b58;--dark:#173f35;--gold:#b28a3b;--line:#ded8c9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
.nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:14px 10px;background:var(--dark)}
.nav a{color:#fff;text-decoration:none;padding:10px 13px;border-radius:999px;background:#2f765f;font-weight:700;font-size:14px}
.wrap{width:min(900px,94%);margin:auto}
.hero{background:linear-gradient(135deg,#173f35,#2f6b58);color:#fff;padding:26px 18px;border-radius:0 0 30px 30px}
.brand{font-size:13px;letter-spacing:3px;opacity:.85;margin-bottom:10px}
.hero h1{margin:0;font-size:34px}.hero p{margin:8px 0 0;font-size:16px;line-height:1.5}
.controls,.reader-card{background:var(--card);margin:16px 0;padding:15px;border-radius:22px;border:1px solid var(--line);box-shadow:0 5px 20px rgba(0,0,0,.05)}
.control-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}
select,button{width:100%;border:1px solid #cfc8b8;border-radius:12px;background:#fff;color:var(--ink);padding:12px;font-size:15px}
button{cursor:pointer;background:var(--green);color:#fff;border:none;font-weight:700}
button.secondary{background:#e8e2d4;color:var(--ink)}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.surah-title{text-align:center;padding:10px;border-bottom:1px solid var(--line);margin-bottom:10px}
.arabic-name{font-size:30px;font-weight:700;direction:rtl}
.english-name{color:var(--muted);margin-top:5px}
.bismillah{text-align:center;direction:rtl;font-family:IndoPak,serif;font-size:28px;margin:12px 0}
.quran-page{direction:rtl;text-align:justify;font-family:IndoPak,"Noto Nastaliq Urdu",serif;font-size:27px;line-height:2.45;color:#172f29;padding:8px 4px}
.quran-page.mode13{min-height:calc(13 * 2.45em)}
.ayah{display:inline}
.ayah-number{display:inline-flex;direction:ltr;align-items:center;justify-content:center;width:1.55em;height:1.55em;margin:0 .12em;border:1px solid var(--gold);border-radius:50%;color:var(--gold);font-family:Arial,sans-serif;font-size:.46em;vertical-align:middle}
.status{text-align:center;color:var(--muted);padding:18px}
.error{color:#9a3d32;background:#fff0ed;border-radius:12px;padding:14px;margin:10px 0;line-height:1.5}
.footer{text-align:center;color:var(--muted);font-size:13px;padding:20px}
@media(max-width:600px){.hero h1{font-size:30px}.control-row{grid-template-columns:1fr}.quran-page{font-size:25px;line-height:2.45}}
</style>
</head>
<body>
<nav class="nav">
<a href="index.html">🏠 Home</a><a href="duas.html">🙌 Duas</a><a href="names.html">🕋 Allah's Names</a><a href="quran.html">📖 Qur'an</a><a href="favorites.html">⭐ Favorites</a>
</nav>

<header class="hero">
<div class="wrap">
<div class="brand">🌙 DAILY DUAS</div>
<h1>📖 Qur'an</h1>
<p>Authentic Arabic Qur'an text loaded directly from your local <b>quran-uthmani.txt</b> file.</p>
</div>
</header>

<main class="wrap">
<section class="controls">
<div class="control-row">
<div>
<label for="surahSelect">🕌 Surah</label>
<select id="surahSelect"></select>
</div>
<div>
<label for="fontSize">🔤 Text size</label>
<select id="fontSize">
<option value="23">Small</option><option value="27" selected>Medium</option>
<option value="31">Large</option><option value="35">Extra large</option>
</select>
</div>
</div>

<div class="control-row">
<div>
<label for="mode">📖 Reading mode</label>
<select id="mode">
<option value="13" selected>13-line Hifz mode</option>
<option value="normal">Normal</option>
</select>
</div>
<div>
<label for="ayahJump">🔢 Start ayah</label>
<select id="ayahJump"></select>
</div>
</div>

<div class="buttons">
<button class="secondary" id="previousBtn">◀ Previous</button>
<button id="nextBtn">Next ▶</button>
</div>
</section>

<section class="reader-card">
<div id="status" class="status">Loading Qur'an…</div>

<div id="reader" hidden>
<div class="surah-title">
<div id="arabicName" class="arabic-name"></div>
<div id="englishName" class="english-name"></div>
</div>

<div id="bismillah" class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
<div id="quranPage" class="quran-page mode13"></div>
</div>
</section>

<div class="footer">
Qur'an text: local Uthmani text file<br>
Built for Daily Duas 🤲
</div>
</main>

<script>
const QURAN_FILE = "./quran-uthmani.txt";

const surahSelect = document.getElementById("surahSelect");
const fontSize = document.getElementById("fontSize");
const mode = document.getElementById("mode");
const ayahJump = document.getElementById("ayahJump");
const previousBtn = document.getElementById("previousBtn");
const nextBtn = document.getElementById("nextBtn");
const status = document.getElementById("status");
const reader = document.getElementById("reader");
const arabicName = document.getElementById("arabicName");
const englishName = document.getElementById("englishName");
const bismillah = document.getElementById("bismillah");
const quranPage = document.getElementById("quranPage");

let allAyahs = [];
let currentSurah = 1;
let currentStart = 0;

function escapeHtml(value){
  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

/*
  Expected local file format:
  1|1|بِسْمِ اللَّهِ...
  1|2|الْحَمْدُ لِلَّهِ...
  2|1|الم...
*/
function parseQuran(text){
  const result = [];
  const lines = text.replace(/^\uFEFF/,"").split(/\r?\n/);

  for(const raw of lines){
    const line = raw.trim();
    if(!line) continue;

    const parts = line.split("|");
    if(parts.length < 3) continue;

    const surah = Number(parts[0].trim());
    const ayah = Number(parts[1].trim());
    const arabic = parts.slice(2).join("|").trim();

    if(!Number.isInteger(surah)) continue;
    if(!Number.isInteger(ayah)) continue;
    if(!arabic) continue;

    result.push({surah,ayah,arabic});
  }

  return result;
}

function showError(message){
  status.hidden = false;
  reader.hidden = true;
  status.className = "status error";
  status.textContent = message;
}

function fillSurahs(){
  surahSelect.innerHTML = "";

  for(let i=1;i<=114;i++){
    const option = document.createElement("option");
    option.value = i;
    option.textContent = "Surah " + i;
    surahSelect.appendChild(option);
  }

  surahSelect.value = String(currentSurah);
}

function render(){
  const ayahs = allAyahs.filter(a => a.surah === currentSurah);

  if(!ayahs.length){
    showError("No verses were found for Surah " + currentSurah + ".");
    return;
  }

  currentStart = Math.max(0,Math.min(currentStart,ayahs.length-1));

  const pageSize = mode.value === "13" ? 13 : ayahs.length;
  const visible = ayahs.slice(currentStart,currentStart + pageSize);

  arabicName.textContent = "سورة " + currentSurah;
  englishName.textContent =
    "Surah " + currentSurah +
    " • Ayah " + visible[0].ayah +
    "–" + visible[visible.length-1].ayah;

  bismillah.style.display = currentSurah === 9 ? "none" : "block";

  quranPage.innerHTML = visible.map(a =>
    '<span class="ayah">' +
    escapeHtml(a.arabic) +
    ' <span class="ayah-number">' + a.ayah + '</span>' +
    '</span>'
  ).join(" ");

  quranPage.style.fontSize = fontSize.value + "px";
  quranPage.classList.toggle("mode13",mode.value === "13");

  ayahJump.innerHTML = "";

  ayahs.forEach((a,i)=>{
    const option = document.createElement("option");
    option.value = i;
    option.textContent = "Ayah " + a.ayah;
    ayahJump.appendChild(option);
  });

  ayahJump.value = String(currentStart);

  previousBtn.disabled = currentStart === 0;
  nextBtn.disabled = currentStart + visible.length >= ayahs.length;

  status.hidden = true;
  reader.hidden = false;
}

async function loadQuran(){
  try{
    const response = await fetch(QURAN_FILE,{cache:"no-store"});

    if(!response.ok){
      throw new Error(
        "Could not load quran-uthmani.txt (" +
        response.status + "). Make sure the file is in the same folder as quran.html."
      );
    }

    const text = await response.text();
    allAyahs = parseQuran(text);

    if(!allAyahs.length){
      throw new Error(
        "The Qur'an file was found, but its format could not be read. Expected: surah|ayah|Arabic text"
      );
    }

    fillSurahs();
    render();

  }catch(error){
    showError(error.message);
  }
}

surahSelect.addEventListener("change",()=>{
  currentSurah = Number(surahSelect.value);
  currentStart = 0;
  render();
});

fontSize.addEventListener("change",render);
mode.addEventListener("change",render);

ayahJump.addEventListener("change",()=>{
  currentStart = Number(ayahJump.value);
  render();
});

previousBtn.addEventListener("click",()=>{
  if(currentStart > 0){
    currentStart = Math.max(0,currentStart - (mode.value === "13" ? 13 : 1));
    render();
  }
});

nextBtn.addEventListener("click",()=>{
  const count = allAyahs.filter(a => a.surah === currentSurah).length;

  if(currentStart < count - 1){
    currentStart = Math.min(
      count - 1,
      currentStart + (mode.value === "13" ? 13 : 1)
    );
    render();
  }
});

loadQuran();
</script>
</body>
</html>
