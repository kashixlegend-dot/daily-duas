<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173f35"><title>Al Quran — Daily Duas</title>
<style>
:root{--bg:#f5f2e9;--card:#fffdf8;--ink:#172f29;--muted:#6d746f;--green:#176b4d;--dark:#173f35;--gold:#d5c7a0;--line:#ded8c9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
.nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:12px 10px;background:var(--dark)}.nav a{color:#fff;text-decoration:none;padding:9px 12px;border-radius:999px;background:#2f765f;font-weight:700;font-size:14px}
.wrap{width:min(900px,94%);margin:auto}.top{padding:24px 0 10px;display:flex;align-items:center;justify-content:space-between}h1{margin:0;font-size:30px}.icons{display:flex;gap:18px;font-size:28px}.icons a{color:var(--ink);text-decoration:none}
.continue{background:var(--card);border-radius:28px;padding:20px 18px;margin:12px 0 16px;border:1px solid var(--line)}.continue h2{margin:0 0 18px;font-size:22px}.continue-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.continue a{background:#e9decc;color:var(--ink);text-decoration:none;border-radius:26px;padding:18px 20px;display:block}.continue strong{font-size:18px}.continue small{display:block;font-size:15px;margin-top:10px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#ddd9d0;border-radius:24px;overflow:hidden;margin:12px 0 20px}.tabs button{border:0;padding:14px;font-size:17px;background:transparent;font-weight:700;color:#5b5a58}.tabs button.active{background:#fff;color:#111}
.search{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:14px 18px;margin-bottom:16px}.search span{font-size:23px}.search input{border:0;outline:0;background:transparent;width:100%;font-size:17px;color:var(--ink)}
.surah-list{background:var(--card);border-radius:24px;overflow:hidden;border:1px solid var(--line)}.surah-item{display:flex;align-items:center;gap:16px;padding:17px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}.number{width:52px;height:52px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-size:17px;flex:none}.surah-info{flex:1}.surah-info strong{display:block;color:var(--green);font-size:19px}.surah-info small{display:block;margin-top:5px;color:#555;font-size:14px}.arrow{font-size:22px;color:var(--green)}.footer{text-align:center;color:var(--muted);font-size:13px;padding:22px}
@media(max-width:600px){.continue-grid{grid-template-columns:1fr 1fr}.continue a{padding:16px 12px}.surah-info strong{font-size:18px}}
</style></head>
<body>
<nav class="nav"><a href="index.html">🏠 Home</a><a href="duas.html">🤲 Duas</a><a href="names.html">🕋 Allah's Names</a><a href="quran.html">📖 Qur'an</a><a href="favorites.html">⭐ Favorites</a></nav>
<main class="wrap"><header class="top"><h1>Al Quran</h1><div class="icons"><a href="favorites.html">♡</a><span>⌕</span><span>⚙</span></div></header>
<section class="continue"><h2>Continue</h2><div class="continue-grid"><a href="quran-surah-indopak.html?surah=1"><strong>Al-Faatiha</strong><small>Surah 1</small></a><a href="quran-surah-indopak.html?surah=2"><strong>Al-Baqarah</strong><small>Surah 2</small></a></div></section>
<div class="tabs"><button class="active" type="button">SURAH</button><button type="button" disabled>JUZ</button></div>
<div class="search"><span>⌕</span><input id="search" placeholder="Search Surah by name or number…" autocomplete="off"></div>

<div class="footer">IndoPak Qur'an pages: Juz 1–10 currently available<br>Built for Daily Duas 🤲</div></main>

function render(filter=''){const q=filter.trim().toLowerCase();const items=surahs.filter(s=>!q||String(s.n)===q||s.name.toLowerCase().includes(q));list.innerHTML=items.map(s=>`<a class="surah-item" href="quran-surah-indopak.html?surah=${s.n}"><span class="number">${s.n}</span><span class="surah-info"><strong>${esc(s.name)}</strong><small>${available.has(s.n)?'IndoPak Juz 1–10 available':'More Juz files will be added later'}</small></span><span class="arrow">›</span></a>`).join('')||'<div style="padding:24px;text-align:center;color:#6d746f">No Surah found.</div>'}
search.addEventListener('input',()=>render(search.value));render();
</script></body></html>
