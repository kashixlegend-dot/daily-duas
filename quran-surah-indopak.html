<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f2e9"><title>Al Quran — IndoPak — Daily Duas</title>
<style>
:root{--bg:#f5f2e9;--card:#fffdf8;--ink:#111;--green:#176b4d;--gold:#b7a06a;--line:#ded8c9;--muted:#70756f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.wrap{width:min(900px,94%);margin:auto}
.top{padding:20px 0 12px;display:flex;align-items:center;justify-content:space-between}.top a{color:var(--ink);text-decoration:none;font-size:31px}.title{font-size:21px;font-weight:800}.icon{font-size:28px}
.selector-row{display:grid;grid-template-columns:1fr auto;gap:12px;margin:8px 0 14px}.selector,.juz{height:58px;border:0;background:#efe7d4;border-radius:30px;padding:0 20px;display:flex;align-items:center;font-size:19px;font-weight:700}.selector{justify-content:space-between;cursor:pointer}.juz{white-space:nowrap}
.reader{background:var(--card);border:1px solid var(--line);border-radius:28px;overflow:hidden}.head{padding:22px 18px 16px;text-align:center;border-bottom:1px solid var(--line)}.head h1{font-size:26px;margin:0 0 12px}.head .ar{font-family:serif;font-size:30px;font-weight:700;direction:rtl}
.notice{padding:12px 16px;text-align:center;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line)}.pdf-wrap{background:#fff;height:min(78vh,900px)}iframe{width:100%;height:100%;border:0;display:block}.status{padding:30px 20px;text-align:center;color:var(--muted);font-size:16px}.bottom{padding:14px;text-align:center;color:var(--muted);font-size:13px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;z-index:20}.sheet.open{display:flex}.sheet-card{width:100%;max-height:82vh;background:var(--card);border-radius:28px 28px 0 0;padding:16px;overflow:auto}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.close{border:0;background:transparent;font-size:28px}
.search{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:12px}.search input{border:0;outline:0;background:transparent;font-size:16px;width:100%}.options{display:grid;gap:4px}.option{display:flex;align-items:center;gap:14px;padding:12px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}.option .num{width:42px;height:42px;border:2px solid #d5c7a0;border-radius:50%;display:grid;place-items:center;flex:none}.option strong{color:var(--green);font-size:17px}.option small{display:block;margin-top:3px;color:var(--muted)}@media(max-width:600px){.selector,.juz{font-size:17px;padding:0 16px}.head h1{font-size:23px}}
</style></head>
<body><main class="wrap">
<header class="top"><a href="quran.html" aria-label="Back">←</a><div class="title">Al Quran</div><div class="icon">⌕</div></header>
<div class="selector-row"><button id="selector" class="selector" type="button"><span id="selectedName">Al-Faatiha</span><span>⌄</span></button><div class="juz" id="juzLabel">Juz 1</div></div>
<section class="reader"><header class="head"><h1 id="surahTitle">Surah 1 · Al-Faatiha</h1><div class="ar" id="arabicName">سورة الفاتحة</div></header>
<div id="status" class="status">Loading IndoPak page…</div><div class="pdf-wrap" id="pdfWrap" hidden><iframe id="pdf" title="IndoPak Qur'an page"></iframe></div></section>
<div class="bottom">Using the IndoPak Juz 1–10 PDFs supplied for Daily Duas.</div></main>
<div id="sheet" class="sheet"><div class="sheet-card"><div class="sheet-head"><strong>Select Surah</strong><button id="close" class="close">×</button></div><div class="search"><span>⌕</span><input id="search" placeholder="Search Surah name or number…" autocomplete="off"></div><div id="options" class="options"></div></div></div>
<script>

const $=id=>document.getElementById(id);let current=Number(new URLSearchParams(location.search).get("surah")||1);if(!surahs.some(s=>s.n===current))current=1;
function renderOptions(q=""){const v=q.trim().toLowerCase();$("options").innerHTML=surahs.filter(s=>!v||String(s.n)===v||s.name.toLowerCase().includes(v)).map(s=>`<a class="option" href="?surah=${s.n}"><span class="num">${s.n}</span><span><strong>${s.name}</strong><small>${pages[s.n]?`IndoPak · Juz ${pages[s.n].juz}`:"Juz 1–10 not yet uploaded"}</small></span></a>`).join("")}
function render(){const s=surahs.find(x=>x.n===current);$("selectedName").textContent=s.name;$("surahTitle").textContent=`Surah ${s.n} · ${s.name}`;$("arabicName").textContent=arabic[s.n]?`سورة ${arabic[s.n]}`:"";const p=pages[s.n];if(!p){$("status").textContent="This Surah needs a later Juz PDF. Juz 1–10 are uploaded now.";return}$("juzLabel").textContent=`Juz ${p.juz}`;$("pdf").src=`juz${String(p.juz).padStart(2,"0")}.pdf#page=${p.page}`;$("status").hidden=true;$("pdfWrap").hidden=false}
