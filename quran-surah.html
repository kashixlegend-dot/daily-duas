<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173f35">
<title>Surah — Daily Duas</title>
<style>
@font-face{font-family:'IndoPak';src:url('https://verses.quran.foundation/fonts/quran/hafs/nastaleeq/indopak/indopak-nastaleeq-waqf-lazim-v4.2.1.woff2') format('woff2'),url('https://verses.quran.foundation/fonts/quran/hafs/nastaleeq/indopak/indopak-nastaleeq-waqf-lazim-v4.2.1.woff') format('woff');font-display:swap}
:root{--bg:#f7f3e8;--card:#fffdf8;--ink:#111;--green:#176b4d;--gold:#b7a06a;--line:#ded8c9;--muted:#6d746f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
.nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:12px 10px;background:#173f35}.nav a{color:#fff;text-decoration:none;padding:9px 12px;border-radius:999px;background:#2f765f;font-weight:700;font-size:14px}
.wrap{width:min(900px,94%);margin:auto}.reader-top{padding:18px 0 10px;display:flex;align-items:center;justify-content:space-between}.reader-top a{color:var(--ink);text-decoration:none;font-size:31px}.icons{display:flex;gap:20px;font-size:28px}
.selector-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin:8px 0 14px}.selector button,.juz{height:58px;border:0;background:#efe7d4;border-radius:30px;padding:0 20px;font-size:19px;color:#111;font-weight:600}.selector button{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center}.juz{display:flex;align-items:center;white-space:nowrap}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.28);display:none;align-items:flex-end;z-index:10}.sheet.open{display:flex}.sheet-card{background:#fffdf8;width:100%;max-height:82vh;border-radius:28px 28px 0 0;padding:18px;overflow:auto}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.close{border:0;background:transparent;font-size:28px}.sheet-search{display:flex;gap:10px;align-items:center;border:1px solid #d5cfbf;border-radius:18px;padding:12px 14px;margin-bottom:12px}.sheet-search input{border:0;outline:0;background:transparent;font-size:16px;width:100%}.options{display:grid;gap:5px}.option{display:flex;align-items:center;gap:14px;padding:13px;border-radius:15px;text-decoration:none;color:#111}.option .num{width:40px;height:40px;border:1.5px solid #d5c7a0;border-radius:50%;display:grid;place-items:center}.option strong{color:var(--green)}
.reader{background:var(--card);border:1px solid var(--line);border-radius:28px;overflow:hidden}.surah-head{padding:20px 18px 12px;text-align:center;border-bottom:1px solid var(--line)}.english-name{font-size:20px;font-weight:700}.arabic-name,.bismillah,.arabic{font-family:'IndoPak',serif;direction:rtl}.arabic-name{font-size:34px;font-weight:700;margin-top:5px}.bismillah{text-align:center;font-size:34px;line-height:2;padding:22px 16px 8px}.ayah{padding:24px 18px 18px;border-bottom:1px solid var(--line)}.arabic{text-align:right;font-size:36px;line-height:2.25;word-break:normal;overflow-wrap:normal;white-space:normal}.num{display:inline-flex;align-items:center;justify-content:center;width:1.55em;height:1.55em;margin:0 .15em;border:1.5px solid var(--gold);border-radius:50%;font:600 .45em Arial,sans-serif;color:#9c8140;vertical-align:middle;direction:ltr}.tools{display:flex;gap:14px;margin-top:16px}.tool{width:54px;height:54px;border:1px solid #d1cab9;border-radius:50%;background:transparent;color:var(--green);font-size:23px}.status{padding:28px;text-align:center;color:var(--muted)}.error{color:#9a3d32}
</style>
</head>
<body>
<nav class="nav"><a href="index.html">🏠 Home</a><a href="duas.html">🤲 Duas</a><a href="names.html">🕋 Allah's Names</a><a href="quran.html">📖 Qur'an</a><a href="favorites.html">⭐ Favorites</a></nav>
<main class="wrap">
<div class="reader-top"><a href="quran.html">←</a><strong>Al Quran</strong><div class="icons"><span>⌕</span><span>⚙</span></div></div>
<div class="selector-row"><div class="selector"><button id="openSelector" type="button"><span id="selectorName">Al-Faatiha</span><span>⌄</span></button></div><div class="juz">Juz 1</div></div>
<section class="reader"><div id="status" class="status">Loading Qur'an…</div><div id="content" hidden><header class="surah-head"><div id="englishName" class="english-name"></div><div id="arabicName" class="arabic-name"></div></header><div id="bismillah" class="bismillah">بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيمِ</div><div id="ayahs"></div></div></section>
</main>
<div id="sheet" class="sheet"><div class="sheet-card"><div class="sheet-head"><strong>Select Surah</strong><button class="close" id="closeSelector">×</button></div><div class="sheet-search"><span>⌕</span><input id="sheetSearch" placeholder="Search Surah name or number…" autocomplete="off"></div><div id="options" class="options"></div></div></div>
<script>
const surahs=['Al-Faatiha','Al-Baqarah','Aal-i-Imraan','An-Nisaa','Al-Maaida',"Al-An'aam","Al-A'raaf",'Al-Anfaal','At-Tawba','Yunus','Hud','Yusuf',"Ar-Ra'd",'Ibraaheem','Al-Hijr','An-Nahl','Al-Israa','Al-Kahf','Maryam','Taa-Haa','Al-Anbiyaa','Al-Hajj',"Al-Mu'minoon",'An-Noor','Al-Furqaan',"Ash-Shu'araa",'An-Naml','Al-Qasas','Al-Ankaboot','Ar-Room','Luqmaan','As-Sajda','Al-Ahzaab','Saba','Faatir','Yaseen','As-Saaffaat','Saad','Az-Zumar','Ghaafir','Fussilat','Ash-Shura','Az-Zukhruf','Ad-Dukhaan','Al-Jaathiya','Al-Ahqaaf','Muhammad','Al-Fath','Al-Hujuraat','Qaaf','Adh-Dhaariyat','At-Tur','An-Najm','Al-Qamar','Ar-Rahmaan','Al-Waaqia','Al-Hadid','Al-Mujaadila','Al-Hashr','Al-Mumtahana','As-Saff',"Al-Jumu'a",'Al-Munaafiqoon','At-Taghaabun','At-Talaaq','At-Tahrim','Al-Mulk','Al-Qalam','Al-Haaqqa',"Al-Ma'aarij",'Nooh','Al-Jinn','Al-Muzzammil','Al-Muddaththir','Al-Qiyaama','Al-Insaan','Al-Mursalaat','An-Naba',"An-Naazi'aat",'Abasa','At-Takwir','Al-Infitaar','Al-Mutaffifin','Al-Inshiqaaq','Al-Burooj','At-Taariq',"Al-A'laa",'Al-Ghaashiya','Al-Fajr','Al-Balad','Ash-Shams','Al-Lail','Ad-Dhuhaa','Ash-Sharh','At-Tin','Al-Alaq','Al-Qadr','Al-Bayyina','Az-Zalzala','Al-Aadiyaat',"Al-Qaari'a",'At-Takaathur','Al-Asr','Al-Humaza','Al-Fil','Quraish',"Al-Maa'oon",'Al-Kawthar','Al-Kaafiroon','An-Nasr','Al-Masad','Al-Ikhlaas','Al-Falaq','An-Naas'];
const currentSurah=Math.max(1,Math.min(114,Number(new URLSearchParams(location.search).get('surah'))||1)),QURAN_FILE='./quran-uthmani.txt';
const status=document.getElementById('status'),content=document.getElementById('content'),ayahsEl=document.getElementById('ayahs'),englishName=document.getElementById('englishName'),arabicName=document.getElementById('arabicName'),selectorName=document.getElementById('selectorName'),bismillah=document.getElementById('bismillah'),sheet=document.getElementById('sheet'),options=document.getElementById('options'),sheetSearch=document.getElementById('sheetSearch');
function esc(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function parse(text){const out=[];for(const raw of text.replace(/^\uFEFF/,'').split(/\r?\n/)){const p=raw.trim().split('|');if(p.length<3)continue;const s=Number(p[0]),a=Number(p[1]),t=p.slice(2).join('|').trim();if(Number.isInteger(s)&&Number.isInteger(a)&&t)out.push({surah:s,ayah:a,arabic:t})}return out}
function stripLeadingBismillah(t){
  // IndoPak text can use different Arabic diacritics/Unicode forms.
  // Remove a leading Bismillah whenever Ayah 1 contains one.
  const clean=s=>s.normalize('NFKC')
    .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g,'')
    .replace(/[ٱأإآ]/g,'ا')
    .replace(/ـ/g,'');
  const c=clean(t);
  if(!/^\s*بسم\s+الله/.test(c)) return t.trim();
  const end=c.search(/الرحيم/);
  if(end<0 || end>180) return t.trim();
  let cut=end+'الرحيم'.length;
  // Map the normalized-character cut back to the original string.
  let normalizedCount=0, originalEnd=0;
  for(let i=0;i<t.length;i++){
    const one=clean(t[i]);
    normalizedCount+=one.length;
    if(normalizedCount>=cut){ originalEnd=i+1; break; }
  }
  return t.slice(originalEnd).trim();
}
function renderOptions(filter=''){const q=filter.trim().toLowerCase();const items=surahs.map((en,i)=>({n:i+1,en})).filter(s=>!q||String(s.n)===q||s.en.toLowerCase().includes(q));options.innerHTML=items.map(s=>`<a class="option" href="quran-surah.html?surah=${s.n}"><span class="num">${s.n}</span><span><strong>${esc(s.en)}</strong></span></a>`).join('')}
function openSheet(){sheet.classList.add('open');sheetSearch.value='';renderOptions();setTimeout(()=>sheetSearch.focus(),50)}
document.getElementById('openSelector').onclick=openSheet;document.getElementById('closeSelector').onclick=()=>sheet.classList.remove('open');sheet.addEventListener('click',e=>{if(e.target===sheet)sheet.classList.remove('open')});sheetSearch.addEventListener('input',()=>renderOptions(sheetSearch.value));
async function load(){try{const r=await fetch(QURAN_FILE,{cache:'no-store'});if(!r.ok)throw Error('Could not load the Qur’an text file.');const all=parse(await r.text()),verses=all.filter(a=>a.surah===currentSurah);if(!verses.length)throw Error('No verses found for this Surah.');const name=surahs[currentSurah-1];selectorName.textContent=name;englishName.textContent=`Surah ${currentSurah} · ${name}`;arabicName.textContent=`سورة ${currentSurah}`;bismillah.style.display=currentSurah===9?'none':'block';ayahsEl.innerHTML=verses.map(v=>{let text=v.arabic;if(v.ayah===1&&currentSurah!==9)text=stripLeadingBismillah(text);if(!text)return '';return `<article class="ayah"><div class="arabic">${esc(text)} <span class="num">${v.ayah}</span></div><div class="tools"><button class="tool" title="Play">▶</button><button class="tool" title="Bookmark">♡</button></div></article>`}).join('');status.hidden=true;content.hidden=false}catch(e){status.className='status error';status.textContent=e.message}}
load();
</script>
</body>
</html>
